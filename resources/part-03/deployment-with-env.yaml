apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello-world
  name: hello-world
spec:
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - image: app-hello-world:latest
        name: app-hello-world
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: hello-world-config-env-vars
